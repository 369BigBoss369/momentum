spring.application.name=Momentum
server.port=8080

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/momentum
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.org=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor=INFO

spring.mvc.hiddenmethod.filter.enabled=true

users.default-user.username=${DU_USERNAME}
users.default-user.password=${DU_PASSWORD}
users.default-user.email=${DU_EMAIL}

spring.thymeleaf.cache=false

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_AUTH_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_AUTH_SECRET}

# AI Service Configuration
ai.service.url=http://localhost:8081/api/v1/ai
ai.service.timeout.connect=10000
ai.service.timeout.read=150000