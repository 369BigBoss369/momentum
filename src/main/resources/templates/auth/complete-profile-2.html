<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum | Set Your Goals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css?v=1.0" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.92), rgba(118, 75, 162, 0.88));
            position: relative;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.25), transparent 55%),
                        radial-gradient(circle at bottom left, rgba(102, 126, 234, 0.35), transparent 60%);
            pointer-events: none;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: min(520px, 92vw);
        }

        .auth-card {
            backdrop-filter: blur(18px);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1.6rem;
            box-shadow: 0 35px 75px rgba(102, 126, 234, 0.38);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.55);
        }

        .auth-header {
            text-align: center;
            padding: 2.6rem 2.4rem 1.8rem;
        }

        .auth-header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 0.55rem;
            color: #2d2a44;
        }

        .auth-header p {
            margin: 0;
            font-size: 0.98rem;
            color: #67648b;
        }

        .auth-form {
            padding: 0 2.4rem 2.2rem;
        }

        .form-floating > label {
            color: #6c6a8d;
        }

        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(102, 126, 234, 0.25);
            border-radius: 0.9rem;
            padding-left: 1.25rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: rgba(102, 126, 234, 0.65);
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.18);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #6c63ff 0%, #a855f7 100%);
            border: none;
            border-radius: 0.9rem;
            padding: 0.95rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            color: white;
            width: 100%;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(108, 99, 255, 0.3);
            color: white;
        }

        .floating-field {
            position: relative;
            margin-bottom: 1.4rem;
        }

        .floating-field .form-floating {
            position: relative;
        }

        .floating-field.has-error .form-control,
        .floating-field.has-error .form-select {
            border-color: rgba(255, 99, 132, 0.55);
            box-shadow: 0 0 0 0.15rem rgba(255, 99, 132, 0.15);
        }

        .floating-field .field-error {
            color: #ff6584;
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 0.45rem;
            padding-left: 0.2rem;
            letter-spacing: 0.01em;
        }

        .floating-field .field-error::before {
            content: '\26A0';
            font-size: 0.72rem;
            margin-right: 0.35rem;
        }

        .global-error {
            background: rgba(255, 99, 132, 0.12);
            border: 1px solid rgba(255, 99, 132, 0.35);
            color: #ff5777;
            border-radius: 0.9rem;
            padding: 0.9rem 1.1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1.4rem;
            box-shadow: 0 12px 26px rgba(255, 99, 132, 0.08);
        }

        .progress-indicator {
            text-align: center;
            padding: 1.5rem 2.4rem 0;
            color: #67648b;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(102, 126, 234, 0.15);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c63ff 0%, #a855f7 100%);
            width: 100%;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .conditional-fields {
            transition: opacity 0.3s ease, max-height 0.3s ease;
            overflow: hidden;
        }

        .conditional-fields.hidden {
            opacity: 0;
            max-height: 0;
            margin: 0;
            padding: 0;
        }

        .conditional-fields:not(.hidden) {
            opacity: 1;
            max-height: 500px;
        }
    </style>
</head>
<body>
    <div class="auth-overlay"></div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="progress-indicator">
                <span>Step 2 of 2</span>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill"></div>
                </div>
            </div>

            <div class="auth-header">
                <h1>Set your fitness goals</h1>
                <p>Help us understand what you want to achieve</p>
            </div>

            <form th:action="@{/complete-profile/step2}" th:method="PATCH" th:object="${userGoalsRequest}" class="auth-form" id="goalsForm">
                <div th:if="${error}" class="global-error" th:text="${error}">Error</div>

                <div class="floating-field" th:classappend="${#fields.hasErrors('goal')} ? 'has-error'">
                    <div class="form-floating">
                        <select class="form-select" 
                                id="goal" 
                                th:field="*{goal}" 
                                required>
                            <option value="">Choose your goal</option>
                            <option th:each="value : ${T(com.momentum.user.model.enums.UserGoal).values()}" th:value="${value}" th:text="${value.displayName}">Goal</option>
                        </select>
                        <label for="goal">Goal</label>
                    </div>
                    <div th:if="${#fields.hasErrors('goal')}" class="field-error" th:each="error : ${#fields.errors('goal')}" th:text="${error}"></div>
                </div>

                <div class="conditional-fields hidden" id="targetWeightFields">
                    <div class="floating-field" th:classappend="${#fields.hasErrors('targetWeight')} ? 'has-error'">
                        <div class="form-floating">
                            <input type="number" 
                                   class="form-control" 
                                   id="targetWeight" 
                                   th:field="*{targetWeight}" 
                                   placeholder="Target Weight"
                                   step="0.1">
                            <label for="targetWeight">Target Weight (kg)</label>
                        </div>
                        <div th:if="${#fields.hasErrors('targetWeight')}" class="field-error" th:each="error : ${#fields.errors('targetWeight')}" th:text="${error}"></div>
                    </div>

                    <div class="floating-field" th:classappend="${#fields.hasErrors('pace')} ? 'has-error'">
                        <div class="form-floating">
                            <input type="number" 
                                   class="form-control" 
                                   id="pace" 
                                   th:field="*{pace}" 
                                   placeholder="Pace"
                                   step="0.1">
                            <label for="pace">Pace (kg per week)</label>
                        </div>
                        <div th:if="${#fields.hasErrors('pace')}" class="field-error" th:each="error : ${#fields.errors('pace')}" th:text="${error}"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient">
                    Complete Setup
                    <i class="bi bi-check-circle ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const goalSelect = document.getElementById('goal');
            const targetWeightFields = document.getElementById('targetWeightFields');
            const targetWeightInput = document.getElementById('targetWeight');
            const paceInput = document.getElementById('pace');

            function toggleConditionalFields() {
                const selectedGoal = goalSelect.value;
                const shouldShow = selectedGoal === 'LOSE_WEIGHT' || selectedGoal === 'GAIN_MUSCLE';
                
                if (shouldShow) {
                    targetWeightFields.classList.remove('hidden');
                    targetWeightInput.setAttribute('required', 'required');
                    paceInput.setAttribute('required', 'required');
                } else {
                    targetWeightFields.classList.add('hidden');
                    targetWeightInput.removeAttribute('required');
                    paceInput.removeAttribute('required');
                    targetWeightInput.value = '';
                    paceInput.value = '';
                }
            }

            goalSelect.addEventListener('change', toggleConditionalFields);
            
            // Initialize on page load
            toggleConditionalFields();
        })();
    </script>
</body>
</html>
