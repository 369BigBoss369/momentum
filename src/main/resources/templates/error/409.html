<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Conflict - Momentum</title>
</head>

<body>
<section layout:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="error-page">
                    <h1 class="display-1 text-warning fw-bold">409</h1>
                    <h2 class="mb-4">Conflict</h2>
                    <p class="lead text-muted mb-4" th:if="${message}" th:text="${message}">There's a conflict with your request.</p>
                    <p class="text-muted mb-5" th:if="!${message}">The request conflicts with the current state of the resource.</p>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="/dashboard" class="btn btn-primary btn-lg">
                            <i class="bi bi-house-door me-2"></i>Go to Dashboard
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-arrow-left me-2"></i>Go Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
