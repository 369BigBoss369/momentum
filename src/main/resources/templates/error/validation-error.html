<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Validation Error - Momentum</title>
</head>

<body>
<section layout:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            Please Correct the Following Errors
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${validationErrors}" class="mb-4">
                            <ul class="list-group list-group-flush">
                                <li th:each="error : ${validationErrors}"
                                    class="list-group-item list-group-item-danger d-flex align-items-center">
                                    <i class="bi bi-x-circle text-danger me-3"></i>
                                    <div>
                                        <strong th:text="${error.key} + ':'" class="text-capitalize"></strong>
                                        <span th:text="${error.value}"></span>
                                    </div>
                                </li>
                            </ul>
                        </div>

                        <div class="text-center">
                            <button onclick="history.back()" class="btn btn-primary btn-lg">
                                <i class="bi bi-arrow-left me-2"></i>Go Back and Fix
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
