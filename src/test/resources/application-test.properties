spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:momentum_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.mvc.hiddenmethod.filter.enabled=true

users.default-user.username=testadmin
users.default-user.password=testpassword
users.default-user.email=testadmin@example.com

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

ai.service.url=http://localhost:8081/api/v1/ai
ai.service.timeout.connect=5000
ai.service.timeout.read=5000
